bundle:
  name: agent_openai_agents_sdk

resources:
  apps:
    agent_openai_agents_sdk:
      name: "agent-openai-agents-sdk"
      description: "OpenAI Agents SDK agent application"
      source_code_path: ./
      config:
        command: ["uv", "run", "start-app"]
        env:
          - name: MLFLOW_TRACKING_URI
            value: "databricks"
          - name: MLFLOW_REGISTRY_URI
            value: "databricks-uc"
          - name: API_PROXY
            value: "http://localhost:8000/invocations"
          - name: CHAT_APP_PORT
            value: "3000"
          - name: CHAT_PROXY_TIMEOUT_SECONDS
            value: "300"
          - name: MLFLOW_EXPERIMENT_ID
            value_from: "experiment"

      # Resources which this app has access to
      resources:
        - name: 'experiment'
          experiment:
            experiment_id: "2028506881011077"
            permission: 'CAN_MANAGE'

      # Scopes for the end-user token that the tools use on behalf of the user
      user_api_scopes:
        - files.files

targets:
  prod:
    mode: production
    default: true
    workspace:
      host: https://dbc-59bc96e6-d850.cloud.databricks.com
      root_path: /Workspace/Users/bence.toth@datapao.com/.bundle/${bundle.name}/${bundle.target}
    resources:
      apps:
        agent_openai_agents_sdk:
          name: agent-openai-agents-sdk
